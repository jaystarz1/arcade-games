<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<title>The Mix It Shop</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-64.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#0a0e18">
<style>
/* ============================================================
   THE MIX IT SHOP — 2.5D arcade floor shell
   Design space is a fixed 1600x900 room, scaled to the viewport.
   Everything is procedural CSS. No image assets required.
   ============================================================ */

:root {
  --design-h: 900;
  --floor-y: 690px;      /* cabinets stand here */
  --ink: #e8eef7;
  --dim: #7c8aa3;
  --room-dark: #04050a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  overflow: hidden;
  background: var(--room-dark);
  color: var(--ink);
  font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
  touch-action: none;
}

/* ---------- viewport / camera ---------- */

#viewport {
  position: fixed;
  inset: 0;
  overflow: hidden;
  cursor: default;
  background:
    radial-gradient(120% 80% at 50% 8%, #131a2b 0%, #080b14 45%, #04050a 100%);
}

/* the scaler maps 900 design-px of height onto the real viewport */
#scaler {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  transform-origin: 0 0;
  will-change: transform;
}

.layer {
  position: absolute;
  top: 0; left: 0;
  height: 900px;
  will-change: transform;
  transform: translate3d(0,0,0);
}

/* ---------- back wall ---------- */

#wall { z-index: 1; }

.wall-panel {
  position: absolute;
  top: 0;
  height: 700px;
  background:
    linear-gradient(180deg, #0a0e18 0%, #0d1220 55%, #070a12 100%);
  border-right: 1px solid rgba(120,150,200,.06);
}

/* neon sign over the hall */
/* "THE" rides small above the main tubing, the way a real shopfront sign is
   laid out. It is placed in its own grid column over "IT" rather than centred
   over the whole name — the true centre of "MIX IT SHOP" falls at the right
   edge of "IT", so centring visibly drifts it right. */
.neon-sign {
  position: absolute;
  top: 20px;
  display: grid;
  grid-template-columns: auto auto auto;
  column-gap: .52em;
  justify-content: start;
  font-size: 44px;
  letter-spacing: .2em;
  font-weight: 700;
  white-space: nowrap;
  color: #ff64c8;
  text-shadow:
    0 0 6px #ff64c8, 0 0 22px #ff2f9f, 0 0 60px rgba(255,47,159,.55),
    0 0 120px rgba(255,47,159,.25);
  animation: neonFlicker 7s infinite;
}
/* letter-spacing also pads the last glyph, which throws off centring;
   the negative margins cancel that trailing space */
.neon-sign .w { grid-row: 2; margin-right: -.2em; }
.neon-sign .the {
  grid-row: 1;
  grid-column: 2;          /* the "IT" column */
  justify-self: center;
  font-size: 21px;
  letter-spacing: .62em;
  margin: 0 -.62em 5px 0;
  color: #ffa8dd;
  text-shadow: 0 0 5px #ff8ed0, 0 0 18px rgba(255,47,159,.7);
}
.neon-sign .sub {
  grid-row: 3;
  grid-column: 1 / -1;
  justify-self: center;
  font-size: 15px;
  letter-spacing: .5em;
  margin: 12px -.5em 0 0;
  color: #6ee7ff;
  text-shadow: 0 0 6px #6ee7ff, 0 0 20px rgba(110,231,255,.6);
}
@keyframes neonFlicker {
  0%, 42%, 44%, 47%, 100% { opacity: 1; }
  43%   { opacity: .55; }
  45.5% { opacity: .72; }
}

/* wall fixtures */
.fixture {
  position: absolute;
  border-radius: 4px;
  background: linear-gradient(180deg, #141b2c, #0a0e18);
  border: 1px solid rgba(140,170,215,.14);
  color: var(--dim);
  font-size: 11px;
  letter-spacing: .18em;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 10px;
  line-height: 1.6;
}
.fixture.change-machine {
  width: 130px; height: 210px; top: 300px;
  background: linear-gradient(180deg, #1d2536, #0e1420);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.05);
}
.fixture.change-machine::after {
  content: "";
  position: absolute;
  bottom: 34px; left: 50%;
  transform: translateX(-50%);
  width: 62px; height: 5px;
  background: #05070c;
  box-shadow: inset 0 1px 2px #000;
  border-radius: 2px;
}
/* EXIT sign at the end of the hall */
.exit-sign {
  position: absolute;
  top: 150px;
  width: 128px; height: 46px;
  border-radius: 3px;
  background: #10331d;
  border: 1px solid #1c6b39;
  color: #6dffa6;
  font-size: 20px;
  letter-spacing: .35em;
  display: flex; align-items: center; justify-content: center;
  text-shadow: 0 0 8px #34d97a, 0 0 26px rgba(52,217,122,.6);
  box-shadow: 0 0 30px rgba(52,217,122,.28);
}

/* ---------- floor ---------- */

#floorLayer { z-index: 2; pointer-events: none; }

#carpet {
  position: absolute;
  left: -50vw;
  top: var(--floor-y);
  width: 400vw;
  height: 700px;
  transform-origin: 50% 0%;
  transform: perspective(520px) rotateX(62deg);
  background-color: #08060f;
  background-image:
    repeating-linear-gradient(90deg,
      rgba(120,60,255,.20) 0 2px, transparent 2px 78px),
    repeating-linear-gradient(0deg,
      rgba(0,220,255,.16) 0 2px, transparent 2px 78px),
    repeating-linear-gradient(45deg,
      rgba(255,60,160,.10) 0 10px, transparent 10px 40px);
  background-size: 78px 78px, 78px 78px, 120px 120px;
  opacity: .85;
}
#carpetFade {
  position: absolute;
  left: 0; top: var(--floor-y);
  width: 100%; height: 240px;
  background: linear-gradient(180deg, rgba(4,5,10,.92) 0%, rgba(4,5,10,0) 42%);
}

/* pools of light thrown by each cabinet, drawn flat (not rotated) */
.pool {
  position: absolute;
  bottom: 0;
  height: 190px;
  border-radius: 50%;
  filter: blur(22px);
  opacity: .30;
  transition: opacity .45s ease, filter .45s ease;
  mix-blend-mode: screen;
}
.pool.lit { opacity: .80; filter: blur(16px); }

/* ---------- cabinet row ---------- */

#row {
  z-index: 3;
  perspective: 1400px;
  perspective-origin: 50% 46%;
}

.cab {
  position: absolute;
  bottom: 210px;              /* 900 - 690 */
  transform-style: preserve-3d;
  transition: filter .4s ease;
  filter: brightness(.62) saturate(.75);
  cursor: pointer;
}
.cab.active { filter: brightness(1) saturate(1.05); }

.cab-body {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 12px 12px 3px 3px;
  background:
    linear-gradient(100deg,
      color-mix(in srgb, var(--accent) 26%, #0b0f1a) 0%,
      #0d1220 26%,
      #0a0e18 74%,
      color-mix(in srgb, var(--accent) 14%, #070a12) 100%);
  border: 1px solid rgba(150,180,225,.10);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 30px 60px rgba(0,0,0,.75);
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* angled side stripe art */
.cab-body::before {
  content: "";
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 26px;
  background: linear-gradient(180deg,
    var(--accent) 0%,
    color-mix(in srgb, var(--accent) 40%, #000) 45%,
    transparent 78%);
  opacity: .55;
}
.cab-body::after {
  content: "";
  position: absolute;
  right: 0; top: 0; bottom: 0;
  width: 26px;
  background: linear-gradient(180deg,
    var(--accent) 0%,
    color-mix(in srgb, var(--accent) 40%, #000) 45%,
    transparent 78%);
  opacity: .30;
}

/* marquee */
.marquee {
  position: relative;
  z-index: 2;
  width: calc(100% - 22px);
  margin-top: 11px;
  height: 58px;
  border-radius: 5px;
  display: flex;
  flex-direction: column;   /* title above the credit line, not beside it */
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 8px;
  background: linear-gradient(180deg,
    color-mix(in srgb, var(--accent) 30%, #131a2a),
    #0a0e18);
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color: color-mix(in srgb, var(--accent) 60%, #ffffff);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  line-height: 1.05;
  text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 70%, transparent);
  box-shadow: inset 0 0 22px color-mix(in srgb, var(--accent) 22%, transparent);
  transition: box-shadow .4s ease, color .4s ease;
}
.cab.active .marquee {
  box-shadow:
    inset 0 0 30px color-mix(in srgb, var(--accent) 42%, transparent),
    0 0 34px color-mix(in srgb, var(--accent) 42%, transparent);
  color: #fff;
  animation: marqueeBuzz 4.5s infinite;
}
@keyframes marqueeBuzz {
  0%, 96%, 100% { filter: none; }
  97%  { filter: brightness(.68); }
  98.5%{ filter: brightness(1.25); }
}
.marquee small {
  display: block;
  font-size: 9px;
  letter-spacing: .28em;
  opacity: .68;
  margin-top: 4px;
  font-weight: 400;
}

/* screen bay */
.bay {
  position: relative;
  z-index: 2;
  margin-top: 12px;
  border-radius: 8px;
  background: #010204;
  border: 1px solid rgba(0,0,0,.9);
  box-shadow:
    inset 0 0 0 8px #0a0d14,
    inset 0 0 34px rgba(0,0,0,.95),
    0 0 0 2px rgba(150,180,225,.07);
  overflow: hidden;
  display: grid;
  place-items: center;
}

.screen {
  position: relative;
  width: 100%; height: 100%;
  overflow: hidden;
  background: #000;
}
/* Stacking inside a cabinet screen, back to front:
   holo placeholder -> attract poster -> live iframe -> CRT -> glass */
.screen img {
  position: absolute;
  inset: 0;
  z-index: 1;
  width: 100%; height: 100%;
  object-fit: cover;
  display: block;
  opacity: .88;
}
.cab.active .screen img { opacity: 1; }
.screen iframe {
  position: absolute;
  top: 0; left: 0;
  z-index: 2;
  border: 0;
  transform-origin: 0 0;
  pointer-events: none;
}
.crt   { z-index: 3; }
.glass { z-index: 4; }

/* fallback behind the poster, visible only if the poster is missing */
.screen .holo {
  position: absolute;
  inset: 0;
  z-index: 0;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 8px;
  font-size: 10px;
  letter-spacing: .22em;
  color: color-mix(in srgb, var(--accent) 70%, #ffffff);
  background:
    radial-gradient(60% 60% at 50% 45%,
      color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 70%),
    #01030a;
  text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 80%, transparent);
}

/* CRT treatment */
.crt {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background:
    repeating-linear-gradient(0deg,
      rgba(0,0,0,.34) 0 1px, transparent 1px 3px),
    radial-gradient(120% 120% at 50% 50%,
      transparent 52%, rgba(0,0,0,.72) 100%);
}
.glass {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: linear-gradient(122deg,
    rgba(255,255,255,.11) 0%,
    rgba(255,255,255,.03) 26%,
    transparent 46%);
}

/* control panel */
.cpanel {
  position: relative;
  z-index: 2;
  margin-top: auto;
  width: calc(100% - 16px);
  height: 84px;
  border-radius: 8px 8px 0 0;
  background: linear-gradient(180deg, #1b2334 0%, #10151f 100%);
  border: 1px solid rgba(150,180,225,.10);
  border-bottom: none;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.06);
}
.stick {
  position: relative;
  width: 13px; height: 30px;
  border-radius: 6px;
  background: linear-gradient(180deg, #39435c, #1b2130);
}
.stick::before {
  content: "";
  position: absolute;
  top: -13px; left: 50%;
  transform: translateX(-50%);
  width: 22px; height: 22px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%, #ff8fb4, #c31d4c 62%, #7c0f2e);
  box-shadow: 0 3px 6px rgba(0,0,0,.6);
}
.stick::after {
  content: "";
  position: absolute;
  bottom: -7px; left: 50%;
  transform: translateX(-50%);
  width: 32px; height: 9px;
  border-radius: 50%;
  background: #0a0e16;
}
.btnrow { display: flex; gap: 9px; align-items: center; }
.pbtn {
  width: 21px; height: 21px;
  border-radius: 50%;
  background: radial-gradient(circle at 34% 30%,
    color-mix(in srgb, var(--accent) 85%, #ffffff),
    color-mix(in srgb, var(--accent) 70%, #000) 62%,
    #0b0f18);
  box-shadow: 0 3px 5px rgba(0,0,0,.65), inset 0 -2px 3px rgba(0,0,0,.4);
}
.cab.active .pbtn { animation: btnPulse 1.9s infinite; }
.cab.active .pbtn:nth-child(2) { animation-delay: .32s; }
@keyframes btnPulse {
  0%, 100% { filter: brightness(1); }
  50%      { filter: brightness(1.7); }
}

/* coin door */
.coindoor {
  position: relative;
  z-index: 2;
  width: 78px; height: 26px;
  margin: 7px 0 9px;
  border-radius: 3px;
  background: linear-gradient(180deg, #222b3d, #0d1119);
  border: 1px solid rgba(150,180,225,.14);
  display: grid;
  place-items: center;
}
.coindoor::after {
  content: "";
  width: 4px; height: 15px;
  border-radius: 2px;
  background: #04060b;
  box-shadow: inset 0 0 3px #000;
}
.credits {
  position: absolute;
  bottom: -2px; right: 6px;
  font-size: 8px;
  letter-spacing: .12em;
  color: color-mix(in srgb, var(--accent) 75%, #ffffff);
  opacity: 0;
  transition: opacity .3s ease;
}
.cab.active .credits { opacity: .95; }

/* lit start strip on the control panel of the active cabinet */
.startlbl {
  font-size: 8px;
  letter-spacing: .16em;
  color: color-mix(in srgb, var(--accent) 55%, #ffffff);
  opacity: .25;
  white-space: nowrap;
  transition: opacity .3s ease;
}
.cab.active .startlbl {
  opacity: 1;
  text-shadow: 0 0 8px color-mix(in srgb, var(--accent) 90%, transparent);
  animation: ctaBlink 1.1s steps(1) infinite;
}

/* floating call-to-action, used by the exit door only */
.cta {
  position: absolute;
  left: 50%;
  top: -46px;
  transform: translateX(-50%);
  white-space: nowrap;
  font-size: 15px;
  letter-spacing: .2em;
  color: #fff;
  text-shadow: 0 0 12px color-mix(in srgb, var(--accent) 90%, transparent);
  opacity: 0;
  transition: opacity .3s ease;
  pointer-events: none;
}
.door.active .cta { opacity: 1; animation: ctaBlink 1.1s steps(1) infinite; }
@keyframes ctaBlink { 0%, 60% { opacity: 1; } 61%, 100% { opacity: .18; } }

/* the exit door at the end of the hall (external game) */
.door {
  position: absolute;
  bottom: 210px;
  width: 210px; height: 380px;
  cursor: pointer;
  filter: brightness(.62);
  transition: filter .4s ease;
}
.door.active { filter: brightness(1); }
.door-frame {
  position: relative;
  width: 100%; height: 100%;
  border-radius: 6px 6px 0 0;
  background: linear-gradient(180deg, #101a2c, #070b13);
  border: 2px solid color-mix(in srgb, var(--accent) 45%, transparent);
  box-shadow: 0 0 40px color-mix(in srgb, var(--accent) 30%, transparent);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  padding: 18px;
}
.door-frame .dtitle {
  font-size: 16px;
  letter-spacing: .14em;
  color: color-mix(in srgb, var(--accent) 60%, #ffffff);
  text-shadow: 0 0 14px color-mix(in srgb, var(--accent) 80%, transparent);
  text-transform: uppercase;
  line-height: 1.3;
}
.door-frame .dsub {
  font-size: 9px;
  letter-spacing: .26em;
  color: var(--dim);
}

/* ---------- player ---------- */

/* #actor carries a transform, which makes it a stacking context — so the
   player's own z-index cannot lift it above #row. The layer must win. */
#actor { z-index: 4; }

/* Seven heads tall (was ~4.8, which read as chibi). The viewBox is 64x136 with
   a head unit of 18: hair crown at y=4, soles at y=130, so the figure is 126
   units = exactly 7 heads. Sized and offset to keep his feet at design y~742,
   forward of the cabinet bases at 690, which is what sells the depth. */
#player {
  position: absolute;
  z-index: 2;
  bottom: 141px;
  width: 182px;
  height: 386px;
  margin-left: -91px;
  will-change: transform;
}
#player svg { width: 100%; height: 100%; overflow: visible; }
#player .limb { transform-origin: 50% 8%; }
#player.walking .leg-a { animation: swingA .46s infinite ease-in-out; }
#player.walking .leg-b { animation: swingB .46s infinite ease-in-out; }
#player.walking .arm-a { animation: swingB .46s infinite ease-in-out; }
#player.walking .arm-b { animation: swingA .46s infinite ease-in-out; }
#player.walking .torso { animation: bob .23s infinite ease-in-out; }
/* limbs are ~50% longer at 7 heads, so the same angle threw a much bigger arc */
@keyframes swingA { 0%,100% { transform: rotate(17deg); } 50% { transform: rotate(-17deg); } }
@keyframes swingB { 0%,100% { transform: rotate(-17deg); } 50% { transform: rotate(17deg); } }
@keyframes bob    { 0%,100% { transform: translateY(0); }  50% { transform: translateY(-3px); } }

/* Head yaw. --yaw runs -1..1 and is driven every frame from which machine he's
   coming up on. The turn is sold three ways at once: the skull shifts and tilts
   on the neck, and the ear on the side he turns away from slides out of sight
   behind it. Any one of those alone just looks like a wobble. */
#player .head {
  transform-origin: 32px 22px;
  transform: translateX(calc(var(--yaw, 0) * 2.3px)) rotate(calc(var(--yaw, 0) * 5deg));
}
#player .ear-l { opacity: calc(1 - 1.15 * max(0, var(--yaw, 0))); }
#player .ear-r { opacity: calc(1 - 1.15 * max(0, -1 * var(--yaw, 0))); }

/* Standing at a cabinet: he settles in front of it and watches. He is drawn
   from behind at all times, so the tell is the chin lift, the slow breath and
   the screen light on him rather than a change of view. */
#player.gazing .head {
  transform: translateX(calc(var(--yaw, 0) * 2.3px)) translateY(-1px)
             rotate(calc(var(--yaw, 0) * 5deg));
}
#player.gazing .torso { animation: breathe 3.6s infinite ease-in-out; }
@keyframes breathe { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.4px); } }
/* screen light spilling onto him, tinted by whichever cabinet he's at */
#player.gazing svg {
  filter: drop-shadow(0 -3px 9px color-mix(in srgb, var(--gazeAccent, #6ee7ff) 24%, transparent));
}
#player .head, #player.gazing svg { transition: filter .45s ease; }

#playerShadow {
  position: absolute;
  z-index: 1;
  bottom: 148px;          /* under his soles at y~742, not the box bottom */
  width: 168px; height: 32px;
  margin-left: -84px;
  border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(0,0,0,.72), transparent 70%);
  filter: blur(3px);
}

/* ---------- HUD ---------- */

/* Top-centre, so the player can walk the full depth of the aisle without
   the caption sitting on his head. */
#plaque {
  position: fixed;
  left: 50%;
  top: 18px;
  transform: translateX(-50%);
  z-index: 30;
  width: min(620px, 92vw);
  padding: 12px 20px 14px;
  border-radius: 10px;
  text-align: center;
  pointer-events: none;
  transition: opacity .3s ease;
}

/* full-width fade so the caption always has contrast without a visible card
   sitting on top of the cabinets (mirrors what #hud does at the bottom) */
#topfade {
  position: fixed;
  left: 0; right: 0; top: 0;
  height: 190px;
  z-index: 29;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(4,5,10,.72) 0%, rgba(4,5,10,.38) 48%, transparent 100%);
}
#plaque .ptitle {
  font-size: clamp(15px, 2.4vw, 21px);
  letter-spacing: .16em;
  text-transform: uppercase;
  color: #fff;
}
#plaque .pmetarow { margin-top: 6px; }
#plaque .pmeta {
  font-size: 10px;
  letter-spacing: .28em;
  color: var(--accent-cur, #7c8aa3);
}
#plaque .pblurb {
  font-size: 11.5px;
  line-height: 1.6;
  color: #94a3b8;
  margin-top: 8px;
}
/* inline with the meta line — a separate row landed on tall cabinets' marquees */
#plaque .pcta {
  font-size: 10px;
  letter-spacing: .26em;
  color: #fff;
  text-shadow: 0 0 12px var(--accent-cur, #6ee7ff);
  animation: ctaBlink 1.1s steps(1) infinite;
}
#plaque .pmeta::after { content: "  ·  "; opacity: .5; }

#hud {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  z-index: 30;
  padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  display: flex;
  gap: 18px;
  justify-content: center;
  flex-wrap: wrap;
  font-size: 10px;
  letter-spacing: .2em;
  color: var(--dim);
  background: linear-gradient(180deg, transparent, rgba(4,5,10,.9) 55%);
  pointer-events: none;
}
#hud b { color: #cbd5e1; font-weight: 600; }
#hud .sound { pointer-events: auto; cursor: pointer; }

/* touch controls */
#touch {
  position: fixed;
  inset: auto 0 0 0;
  z-index: 29;
  display: none;
  justify-content: space-between;
  padding: 0 14px calc(52px + env(safe-area-inset-bottom));
  pointer-events: none;
}
#touch button {
  pointer-events: auto;
  width: 62px; height: 62px;
  border-radius: 50%;
  border: 1px solid rgba(150,180,225,.28);
  background: rgba(12,18,30,.72);
  color: #cbd5e1;
  font-size: 22px;
  backdrop-filter: blur(6px);
}
body.touch #touch { display: flex; }

/* ---------- stage (playing) ---------- */

#stage {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: #000;
  opacity: 0;
  visibility: hidden;
  transition: opacity .34s ease, visibility 0s linear .34s;
}
#stage.on {
  opacity: 1;
  visibility: visible;
  transition: opacity .34s ease, visibility 0s;
}
#stage iframe {
  width: 100%; height: 100%;
  border: 0;
  display: block;
}
#stageBack {
  position: absolute;
  top: 14px; left: 14px;
  z-index: 2;
  padding: 9px 15px;
  border-radius: 6px;
  border: 1px solid rgba(150,180,225,.3);
  background: rgba(6,10,18,.78);
  color: #cbd5e1;
  font: inherit;
  font-size: 11px;
  letter-spacing: .2em;
  cursor: pointer;
  backdrop-filter: blur(6px);
  transition: opacity .5s ease;
}
/* stays legible once faded — it is the fallback way out if ESC is ever
   swallowed, so it must never be invisible */
#stageBack.faded { opacity: .34; }
#stageBack:hover, #stageBack:focus-visible { opacity: 1; }

#boot {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: #6ee7ff;
  font-size: 13px;
  letter-spacing: .34em;
  background: #000;
  transition: opacity .4s ease;
}
#boot.gone { opacity: 0; pointer-events: none; }

/* ---------- title card ---------- */

#titlecard {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: grid;
  place-items: center;
  text-align: center;
  background: radial-gradient(70% 60% at 50% 45%, #0d1220, #04050a 75%);
  transition: opacity .6s ease, visibility 0s linear .6s;
}
#titlecard.gone { opacity: 0; visibility: hidden; }
#titlecard h1 {
  display: grid;
  grid-template-columns: auto auto auto;
  column-gap: .52em;
  justify-content: center;
  font-size: clamp(1.9rem, 8vw, 4.4rem);
  letter-spacing: .16em;
  line-height: 1.05;
  color: #ff64c8;
  text-shadow: 0 0 10px #ff64c8, 0 0 40px rgba(255,47,159,.6);
}
#titlecard h1 .w { grid-row: 2; margin-right: -.16em; }
#titlecard .tc-the {
  grid-row: 1;
  grid-column: 2;          /* sits over "IT", not over the whole name */
  justify-self: center;
  font-size: .34em;
  letter-spacing: .6em;
  margin: 0 -.6em .5em 0;
  color: #ffa8dd;
  text-shadow: 0 0 6px #ff8ed0, 0 0 22px rgba(255,47,159,.7);
}
#titlecard .tc-sub {
  margin-top: 22px;
  font-size: 12px;
  letter-spacing: .42em;
  color: #6ee7ff;
  animation: ctaBlink 1.3s steps(1) infinite;
}
#titlecard .tc-hint {
  margin-top: 40px;
  font-size: 10px;
  letter-spacing: .22em;
  color: #64748b;
  line-height: 2;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  #scaler, .layer { transition: none !important; }
}
</style>
</head>

        <svg viewBox="0 0 64 136" aria-hidden="true">

      ARROW KEYS TO WALK &middot; ENTER TO PLAY<br>
      C FOR A COIN &middot; M TO MUTE THE ROOM &middot; ESC TO LEAVE A GAME
    </div>
  </div>

<script>
"use strict";

/* Cloudflare Pages strips ".html", so a game's hardcoded back button to
   /arcade.html becomes /arcade — which could resolve to either the exit shim
   (arcade.html) or this file (arcade/index.html). It currently picks the shim,
   but that precedence is undocumented. If this shell ever finds itself inside
   a frame, it was loaded by mistake: behave like the shim and get out. */
if (window.parent !== window) {
  parent.postMessage({ type: "arcade:exit" }, "*");
}

/* ============================================================
   GAME MANIFEST
   ratio = native width / height. Drives cabinet orientation.
   ============================================================ */

const GAMES = [
  { id:"night-driver", title:"Night Driver", year:1976, pub:"Atari",
    src:"../night-driver.html", w:1600, h:1200, accent:"#fbbf24",
    blurb:"Pure headlights and roadside pylons. First-person driving, before graphics." },

  { id:"galaga", title:"Galaga", year:1981, pub:"Namco",
    src:"../galaga.html", w:864, h:1152, accent:"#f472b6",
    blurb:"Let them capture your fighter, then take it back for dual fire." },

  { id:"pole-position", title:"Pole Position", year:1982, pub:"Namco",
    src:"../pole-position.html", w:1280, h:960, accent:"#f97316",
    blurb:"Qualify, then race Fuji Speedway against the clock and the pack." },

  { id:"tron", title:"Tron", year:1982, pub:"Bally Midway",
    src:"../tron.html", w:960, h:1024, accent:"#22d3ee",
    blurb:"Light cycles, MCP cone, tanks and grid bugs. Derezz or be derezzed." },

  { id:"asteroids", title:"Asteroids", year:1979, pub:"Atari",
    src:"../AsteroidsArcade/dist/public/index.html", w:1000, h:800, accent:"#7dd3fc",
    blurb:"Vector rocks, hyperspace, and the flying saucer that always finds you." },

  { id:"space-invaders", title:"Space Invaders", year:1978, pub:"Taito",
    src:"../space-invaders/space-invaders.html", w:896, h:1024, accent:"#4ade80",
    blurb:"The march gets faster the fewer are left." },

  { id:"star-wars", title:"Star Wars", year:1983, pub:"Atari",
    src:"../star-wars.html", w:1600, h:1200, accent:"#60a5fa",
    blurb:"TIE fighters, tower run, trench. Use the Force on the exhaust port." },

  { id:"lunar-lander", title:"Lunar Lander", year:1979, pub:"Atari",
    src:"../lunar-lander/dist/index.html", w:1280, h:800, accent:"#a3e635",
    blurb:"Burn fuel, kill your descent rate, touch down soft on the flat bit." },

  { id:"after-burner", title:"After Burner", year:1987, pub:"Sega",
    src:"../after-burner.html", w:1280, h:960, accent:"#fb7185",
    blurb:"Missile lock, barrel roll, afterburner. Sega's rolling-horizon dogfight." },

  { id:"grand-prix", title:"Grand Prix", year:1982, pub:"Activision",
    src:"../grand-prix.html", w:1280, h:960, accent:"#84cc16",
    blurb:"Top-down formula racing. Clean lines, no brakes, four circuits." },

  { id:"mission-command", title:"Mission Command", year:null, pub:"Original",
    src:"../mission-command.html", w:800, h:600, accent:"#34d399",
    blurb:"Missile defense: intercept incoming, keep the cities standing." },

  { id:"ice-breaker", title:"Ice Breaker", year:2026, pub:"Original",
    src:"../ice-breaker-game/index.html", w:1280, h:800, accent:"#38bdf8",
    blurb:"Arctic survival strategy. Northwest Passage, 2045. From the novel by Cole Black." },

  { id:"breach-protocol", title:"Breach Protocol", year:2026, pub:"Original",
    src:"https://jaystarz1.github.io/breach-protocol/", external:true, accent:"#f43f5e",
    blurb:"Urban counter-terror FPS. Separate build — opens in its own window." },
];

/* ============================================================
   GEOMETRY
   ============================================================ */

const DESIGN_H   = 900;
const FLOOR_Y    = 690;
const CAB_GAP    = 96;
const HALL_PAD   = 340;
const WALK_SPEED = 0.62;   // design px per ms

// horizontal cabinets vs vertical cabinets
const CAB_H_W = 306, CAB_H_H = 496;   // horizontal-screen cabinet body
const CAB_V_W = 276, CAB_V_H = 580;   // vertical-screen cabinet body

const els = {
  viewport: document.getElementById("viewport"),
  scaler:   document.getElementById("scaler"),
  wall:     document.getElementById("wall"),
  floor:    document.getElementById("floorLayer"),
  carpet:   document.getElementById("carpet"),
  pools:    document.getElementById("pools"),
  row:      document.getElementById("row"),
  actor:    document.getElementById("actor"),
  player:   document.getElementById("player"),
  shadow:   document.getElementById("playerShadow"),
  plaque:   document.getElementById("plaque"),
  pTitle:   document.getElementById("pTitle"),
  pMeta:    document.getElementById("pMeta"),
  pBlurb:   document.getElementById("pBlurb"),
  stage:    document.getElementById("stage"),
  stageBack:document.getElementById("stageBack"),
  boot:     document.getElementById("boot"),
  title:    document.getElementById("titlecard"),
  soundState: document.getElementById("soundState"),
};

const state = {
  playerX: 0,
  camX: 0,
  hallWidth: 0,
  scale: 1,
  vwDesign: 1600,
  activeIdx: -1,
  walking: 0,          // -1, 0, 1
  headYaw: 0,          // -1..1, eased toward the machine he's watching
  playing: false,
  started: false,
  attractTimer: null,
  lastT: 0,
  credits: Object.create(null),
};

const slots = [];   // {game, x, w, h, el, poolEl, screenEl}

/* ---------- build the hall ---------- */

function buildHall() {
  let x = HALL_PAD;

  GAMES.forEach((g, i) => {
    if (g.external) {
      const w = 210, h = 380;
      const el = document.createElement("div");
      el.className = "door";
      el.style.setProperty("--accent", g.accent);
      el.style.left = x + "px";
      el.style.width = w + "px";
      el.style.height = h + "px";
      el.innerHTML =
        '<div class="door-frame">' +
          '<div class="dtitle">' + g.title + '</div>' +
          '<div class="dsub">EXTERNAL &middot; NEW WINDOW</div>' +
        '</div>' +
        '<div class="cta">PRESS ENTER TO OPEN</div>';
      els.row.appendChild(el);

      const slot = { game:g, idx:i, x, w, h, el, screenEl:null, poolEl:makePool(x, w, g.accent) };
      el.addEventListener("click", () => walkToAndPlay(slot));
      slots.push(slot);
      x += w + CAB_GAP;
      return;
    }

    const vertical = (g.h / g.w) > 1.05;
    const w = vertical ? CAB_V_W : CAB_H_W;
    const h = vertical ? CAB_V_H : CAB_H_H;

    // aperture: fit game ratio into the available bay box
    const bayMaxW = w - 46;
    const bayMaxH = vertical ? 318 : 226;
    const r = g.w / g.h;
    let aw = bayMaxW, ah = aw / r;
    if (ah > bayMaxH) { ah = bayMaxH; aw = ah * r; }
    aw = Math.round(aw); ah = Math.round(ah);

    const el = document.createElement("div");
    el.className = "cab";
    el.style.setProperty("--accent", g.accent);
    el.style.left = x + "px";
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.innerHTML =
      '<div class="cab-body">' +
        '<div class="marquee">' + g.title +
          '<small>' + (g.year ? g.year + " · " + g.pub : g.pub) + '</small>' +
        '</div>' +
        '<div class="bay" style="width:' + (aw + 16) + 'px;height:' + (ah + 16) + 'px">' +
          '<div class="screen" style="width:' + aw + 'px;height:' + ah + 'px">' +
            '<div class="holo">' + g.title.toUpperCase() + '<br>ATTRACT</div>' +
            '<img src="posters/' + g.id + '.png" alt="" ' +
                 'onerror="this.remove()">' +
            '<div class="crt"></div><div class="glass"></div>' +
          '</div>' +
        '</div>' +
        '<div class="coindoor"></div>' +
        '<div class="cpanel">' +
          '<div class="stick"></div>' +
          '<div class="btnrow"><div class="pbtn"></div><div class="pbtn"></div></div>' +
          '<div class="startlbl">PRESS<br>ENTER</div>' +
        '</div>' +
        '<div class="credits">CREDIT 0</div>' +
      '</div>';

    els.row.appendChild(el);

    const slot = {
      game: g, idx: i, x, w, h, el,
      screenEl: el.querySelector(".screen"),
      creditsEl: el.querySelector(".credits"),
      poolEl: makePool(x, w, g.accent),
      aw, ah,
    };
    el.addEventListener("click", () => walkToAndPlay(slot));
    slots.push(slot);

    x += w + CAB_GAP;
  });

  state.hallWidth = x + HALL_PAD;
  state.playerX = HALL_PAD + 120;

  buildWall();
}

function makePool(x, w, accent) {
  const p = document.createElement("div");
  p.className = "pool";
  p.style.left = (x - 40) + "px";
  p.style.width = (w + 80) + "px";
  p.style.background =
    "radial-gradient(ellipse at center, " + accent + " 0%, transparent 68%)";
  els.pools.appendChild(p);
  return p;
}

function buildWall() {
  const W = state.hallWidth;
  const panel = document.createElement("div");
  panel.className = "wall-panel";
  panel.style.left = "0px";
  panel.style.width = W + "px";
  els.wall.appendChild(panel);

  const sign = document.createElement("div");
  sign.className = "neon-sign";
  sign.style.left = "40px";   /* over the entrance, clear of the top caption */
  sign.innerHTML =
    "<span class='the'>THE</span>" +
    "<span class='w'>MIX</span><span class='w'>IT</span><span class='w'>SHOP</span>" +
    "<span class='sub'>OPEN 24 HOURS</span>";
  els.wall.appendChild(sign);

  const change = document.createElement("div");
  change.className = "fixture change-machine";
  change.style.left = (HALL_PAD - 190) + "px";
  change.textContent = "CHANGE";
  els.wall.appendChild(change);

  /* No wall posters. They hung in mid-air in the gaps between cabinets with
     nothing anchoring them, so they read as floating panels rather than
     signage. The change machine and the exit sign carry the wall on their own. */

  const exit = document.createElement("div");
  exit.className = "exit-sign";
  exit.style.left = (W - 300) + "px";
  exit.textContent = "EXIT";
  els.wall.appendChild(exit);
}

/* ---------- layout / camera ---------- */

function resize() {
  const vh = window.innerHeight;
  const vw = window.innerWidth;
  state.scale = vh / DESIGN_H;
  state.vwDesign = vw / state.scale;
  els.scaler.style.transform = "scale(" + state.scale + ")";
  render(true);
}

function render(snap) {
  // camera centres on the player, clamped to the hall
  const half = state.vwDesign / 2;
  let target = state.playerX - half;
  const maxCam = Math.max(0, state.hallWidth - state.vwDesign);
  target = Math.max(0, Math.min(maxCam, target));

  state.camX = snap ? target : state.camX + (target - state.camX) * 0.14;

  const c = state.camX;
  els.wall.style.transform  = "translate3d(" + (-c * 0.35) + "px,0,0)";
  els.row.style.transform   = "translate3d(" + (-c) + "px,0,0)";
  els.actor.style.transform = "translate3d(" + (-c) + "px,0,0)";
  els.floor.style.transform = "translate3d(" + (-c) + "px,0,0)";
  els.carpet.style.backgroundPositionX = (-c * 1.18) + "px";

  els.player.style.transform = "translate3d(" + state.playerX + "px,0,0) scaleX(" + (state.facing || 1) + ")";
  els.shadow.style.transform = "translate3d(" + state.playerX + "px,0,0)";

  // 2.5D: cabinets angle toward the camera centre
  const centre = c + half;
  for (const s of slots) {
    const off = ((s.x + s.w / 2) - centre) / half;   // -1 .. 1
    const rot = Math.max(-1, Math.min(1, off)) * -9;
    s.el.style.transform = "rotateY(" + rot.toFixed(2) + "deg)";
  }
}

/* ---------- active cabinet + attract ---------- */

function updateActive() {
  let best = -1, bestD = Infinity;
  slots.forEach((s, i) => {
    const d = Math.abs((s.x + s.w / 2) - state.playerX);
    if (d < bestD) { bestD = d; best = i; }
  });
  if (bestD > 260) best = -1;
  if (best === state.activeIdx) return;

  // leave the old one
  if (state.activeIdx >= 0) {
    const old = slots[state.activeIdx];
    old.el.classList.remove("active");
    old.poolEl.classList.remove("lit");
    killAttract(old);
  }

  state.activeIdx = best;
  clearTimeout(state.attractTimer);

  if (best < 0) {
    els.plaque.style.opacity = "0";
    return;
  }

  const s = slots[best];
  s.el.classList.add("active");
  s.poolEl.classList.add("lit");

  els.plaque.style.opacity = "1";
  els.pTitle.textContent = s.game.title;
  els.pMeta.textContent  = (s.game.year ? s.game.year + "  ·  " : "") + s.game.pub;
  els.pBlurb.textContent = s.game.blurb;
  els.plaque.style.setProperty("--accent-cur", s.game.accent);
  els.player.style.setProperty("--gazeAccent", s.game.accent);

  // debounce so walking past a row doesn't spawn a dozen iframes
  state.attractTimer = setTimeout(() => startAttract(s), 420);
}

function startAttract(s) {
  if (!s.screenEl || s.game.external || state.playing) return;
  if (s.screenEl.querySelector("iframe")) return;

  const f = document.createElement("iframe");
  f.setAttribute("scrolling", "no");
  f.setAttribute("tabindex", "-1");
  f.setAttribute("aria-hidden", "true");
  // An attract cabinet must never be able to take the keyboard. Space Invaders
  // and Lunar Lander both call canvas.focus() on load because they listen for
  // keydown on the canvas itself; without this the floor freezes the moment you
  // walk up to them. `inert` blocks focus entering the subtree; the tick loop
  // reclaims focus as a backstop if a game grabs it anyway.
  f.inert = true;
  f.style.width  = s.game.w + "px";
  f.style.height = s.game.h + "px";
  const k = Math.min(s.aw / s.game.w, s.ah / s.game.h);
  const ox = (s.aw - s.game.w * k) / 2;
  const oy = (s.ah - s.game.h * k) / 2;
  f.style.transform = "translate(" + ox + "px," + oy + "px) scale(" + k + ")";
  f.addEventListener("load", () => { silenceFrame(f); bindKeysInto(f); });
  f.src = s.game.src;

  // z-index puts it above the poster; the CRT/glass overlays stay on top
  s.screenEl.appendChild(f);
}

function killAttract(s) {
  if (!s.screenEl) return;
  const f = s.screenEl.querySelector("iframe");
  if (f) { f.src = "about:blank"; f.remove(); }
}

/* ---------- play / exit ---------- */

function walkToAndPlay(s) {
  if (state.playing) return;
  state.playerX = s.x + s.w / 2;
  updateActive();
  render(true);
  play(s);
}

function play(s) {
  if (state.playing) return;
  const g = s.game;

  if (g.external) {
    window.open(g.src, "_blank", "noopener");
    return;
  }

  state.playing = true;
  killAttract(s);
  sound.duck(true);
  sound.coin();

  els.boot.classList.remove("gone");
  els.boot.textContent = "LOADING  " + g.title.toUpperCase();
  els.stage.classList.add("on");

  const f = document.createElement("iframe");
  f.id = "stageFrame";
  f.setAttribute("allow", "autoplay; fullscreen; gamepad");

  /* Several games navigate away on their own back button — three of them to a
     hard-coded absolute "/arcade.html", which resolves outside the site when
     Pages serves us from a subpath like /arcade-games/. Rather than patch each
     game (two are minified bundles), treat ANY navigation after the first load
     as "the player asked to leave". Covers the known three and anything future. */
  let firstLoad = true;
  f.addEventListener("load", () => {
    if (!firstLoad) { leave(); return; }
    firstLoad = false;
    els.boot.classList.add("gone");
    try { f.contentWindow.focus(); } catch (_) {}

    /* The game needs the keyboard to be playable, which means ESC lands inside
       the frame and the shell never sees it. Same-origin, so listen in there.
       Capture phase, so a game that handles or swallows ESC itself can't stop
       the player getting out. */
    try {
      f.contentDocument.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          e.preventDefault();
          e.stopPropagation();
          leave();
        }
      }, true);
    } catch (_) {
      /* cross-origin game (none today): the EXIT button is the way out */
    }
  });

  f.src = g.src;
  els.stage.insertBefore(f, els.stage.firstChild);

  els.stageBack.classList.remove("faded");
  setTimeout(() => els.stageBack.classList.add("faded"), 3200);
}

function leave() {
  if (!state.playing) return;
  state.playing = false;
  const f = document.getElementById("stageFrame");
  if (f) { f.src = "about:blank"; f.remove(); }
  els.stage.classList.remove("on");
  els.boot.classList.remove("gone");
  sound.duck(false);
  window.focus();

  // restart the attract on whatever cabinet we're standing at
  if (state.activeIdx >= 0) {
    clearTimeout(state.attractTimer);
    state.attractTimer = setTimeout(() => startAttract(slots[state.activeIdx]), 500);
  }
}

/* the games with a hardcoded back button hit /arcade.html, which posts this */
window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "arcade:exit") leave();
});

/* ---------- coins ---------- */

function insertCoin() {
  if (state.activeIdx < 0) return;
  const s = slots[state.activeIdx];
  if (!s.creditsEl) return;
  state.credits[s.game.id] = (state.credits[s.game.id] || 0) + 1;
  s.creditsEl.textContent = "CREDIT " + state.credits[s.game.id];
  sound.coin();
}

/* ---------- sound (fully synthesized, no assets) ---------- */

const sound = (() => {
  let ctx = null, master = null, bed = null, on = false, ducked = false;
  let emitters = [];

  function ensure() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    buildBed();
  }

  function buildBed() {
    bed = ctx.createGain();
    bed.gain.value = 0.5;
    bed.connect(master);

    // low room hum
    const hum = ctx.createOscillator();
    hum.type = "sine"; hum.frequency.value = 58;
    const humG = ctx.createGain(); humG.gain.value = 0.05;
    hum.connect(humG).connect(bed); hum.start();

    // filtered noise = crowd / ventilation
    const len = ctx.sampleRate * 2;
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    const noise = ctx.createBufferSource();
    noise.buffer = buf; noise.loop = true;
    const lp = ctx.createBiquadFilter();
    lp.type = "lowpass"; lp.frequency.value = 620;
    const nG = ctx.createGain(); nG.gain.value = 0.035;
    noise.connect(lp).connect(nG).connect(bed); noise.start();

    buildEmitters();
  }

  /* ---- the room mix ----
     Six machines standing at fixed points down the hall, each running its own
     generative voice. Every one gets a panner and a lowpass whose cutoff and
     gain track how far it is from the player, so walking the aisle sweeps
     through the layers instead of hearing one flat wash. Nothing here is a
     recording of a real game: it's shaped noise and oscillators that sit in
     the same register, which is what "arcade in the next room" actually is. */
  function buildEmitters() {
    const W = Math.max(2200, state.hallWidth || 2600);
    const kinds = ["shooter", "racer", "jingle", "thump", "shooter", "jingle"];
    emitters = kinds.map((kind, i) => {
      // spread across the hall, nudged off a perfect grid so they don't beat
      // against the cabinet spacing
      const x = (W * (i + 0.5)) / kinds.length + (i % 2 ? 90 : -90);

      const g = ctx.createGain();
      g.gain.value = 0.0;
      const lp = ctx.createBiquadFilter();
      lp.type = "lowpass"; lp.frequency.value = 700;
      let out = lp;
      let pan = null;
      if (ctx.createStereoPanner) {
        pan = ctx.createStereoPanner();
        lp.connect(pan).connect(g);
      } else {
        lp.connect(g);
      }
      g.connect(bed);

      const em = { kind, x, in: lp, gain: g, lp, pan, level: 0 };
      startVoice(em);
      return em;
    });
    roomAt(state.playerX || 0);
  }

  function noiseBurst(dest, t, dur, cut, amp) {
    const nb = ctx.createBuffer(1, Math.max(64, ctx.sampleRate * dur), ctx.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i = 0; i < nd.length; i++) {
      nd[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / nd.length, 1.8);
    }
    const ns = ctx.createBufferSource(); ns.buffer = nb;
    const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut;
    const g = ctx.createGain(); g.gain.value = amp;
    ns.connect(f).connect(g).connect(dest);
    ns.start(t);
  }

  function blip(dest, t, f0, f1, dur, type, amp) {
    const o = ctx.createOscillator();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(amp, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(dest);
    o.start(t); o.stop(t + dur + 0.02);
  }

  const PENT = [0, 2, 4, 7, 9, 12, 14];

  function startVoice(em) {
    if (em.kind === "racer") {
      // continuous engine: two detuned saws with a slow wobble on top
      [0, 3.5].forEach((det) => {
        const o = ctx.createOscillator();
        o.type = "sawtooth";
        o.frequency.value = 82 + det;
        const g = ctx.createGain(); g.gain.value = 0.055;
        const lfo = ctx.createOscillator();
        lfo.type = "sine"; lfo.frequency.value = 0.07 + Math.random() * 0.09;
        const lg = ctx.createGain(); lg.gain.value = 26;   // Hz of pitch sweep
        lfo.connect(lg).connect(o.frequency);
        o.connect(g).connect(em.in);
        o.start(); lfo.start();
      });
      return;
    }

    // the rest are scheduled patterns; each reschedules itself
    (function fire() {
      if (!ctx) return;
      const t = ctx.currentTime + 0.02;
      let next;

      if (em.kind === "shooter") {
        // a four-note descending march, then a couple of shots over it
        const base = 108 + Math.random() * 30;
        for (let i = 0; i < 4; i++) {
          blip(em.in, t + i * 0.34, base * (1 - i * 0.06), base * (1 - i * 0.06),
               0.16, "square", 0.05);
        }
        const shots = 1 + (Math.random() * 3 | 0);
        for (let i = 0; i < shots; i++) {
          const st = t + Math.random() * 1.3;
          blip(em.in, st, 900 + Math.random() * 500, 180, 0.1, "square", 0.03);
        }
        if (Math.random() < 0.35) noiseBurst(em.in, t + 1.0, 0.3, 1100, 0.09);
        next = 1500 + Math.random() * 1800;

      } else if (em.kind === "jingle") {
        // attract-mode melody: short pentatonic phrase, then a long rest
        const root = 196 * (Math.random() < 0.5 ? 1 : 1.5);
        const n = 4 + (Math.random() * 4 | 0);
        for (let i = 0; i < n; i++) {
          const semi = PENT[(Math.random() * PENT.length) | 0];
          const f = root * Math.pow(2, semi / 12);
          blip(em.in, t + i * 0.15, f, f, 0.13, "triangle", 0.035);
        }
        next = 5000 + Math.random() * 7000;

      } else {   // thump: explosions and cabinet knocks
        noiseBurst(em.in, t, 0.42, 420, 0.16);
        if (Math.random() < 0.5) noiseBurst(em.in, t + 0.55, 0.22, 700, 0.1);
        next = 3200 + Math.random() * 5200;
      }

      em.timer = setTimeout(fire, next);
    })();
  }

  /* Distance model. Close machines are louder and brighter; the far end of the
     hall is a muffled rumble. Ramps are short but not instant so a fast walk
     doesn't zipper the gain. */
  function roomAt(px) {
    if (!ctx || !emitters.length) return;
    const t = ctx.currentTime;
    for (const em of emitters) {
      const d = Math.abs(em.x - px);
      const near = Math.max(0, 1 - d / 1500);           // 1 at the machine, 0 far off
      const lvl = 0.10 + 0.90 * near * near;
      em.gain.gain.setTargetAtTime(lvl, t, 0.12);
      em.lp.frequency.setTargetAtTime(480 + 2200 * near, t, 0.12);
      if (em.pan) {
        const p = Math.max(-1, Math.min(1, (em.x - px) / 950));
        em.pan.pan.setTargetAtTime(p, t, 0.12);
      }
    }
  }

  function gainTarget() { return on ? (ducked ? 0.05 : 0.5) : 0; }
  function apply() {
    if (!ctx) return;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.linearRampToValueAtTime(gainTarget(), ctx.currentTime + 0.35);
  }

  return {
    toggle() {
      ensure();
      if (!ctx) return;
      if (ctx.state === "suspended") ctx.resume();
      on = !on;
      apply();
      try { localStorage.setItem("arcade.sound", on ? "1" : "0"); } catch (_) {}
      els.soundState.textContent = on ? "ON" : "OFF";
    },
    unlock() {
      ensure();
      if (ctx && ctx.state === "suspended") ctx.resume();
      // The room is meant to be running when you walk in — the point of the bed
      // is that you hear the arcade before you look at it. Autoplay policy is
      // satisfied because unlock() only ever runs off the keypress or click
      // that dismisses the title card. M still turns it off, and that sticks.
      let want = "1";
      try { want = localStorage.getItem("arcade.sound") || "1"; } catch (_) {}
      if (want === "1" && !on) { on = true; apply(); els.soundState.textContent = "ON"; }
    },
    roomAt,
    duck(v) { ducked = v; apply(); },
    coin() {
      if (!ctx || !on) return;
      const t = ctx.currentTime;
      // metallic ring
      [1180, 1760, 2340].forEach((fr, i) => {
        const o = ctx.createOscillator();
        o.type = "square"; o.frequency.value = fr;
        const g = ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.05 / (i + 1), t + 0.004);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.34);
        o.connect(g).connect(master);
        o.start(t); o.stop(t + 0.36);
      });
      // clunk
      const nb = ctx.createBuffer(1, ctx.sampleRate * 0.08, ctx.sampleRate);
      const nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length);
      const ns = ctx.createBufferSource(); ns.buffer = nb;
      const ng = ctx.createGain(); ng.gain.value = 0.09;
      const nf = ctx.createBiquadFilter(); nf.type = "bandpass"; nf.frequency.value = 2400;
      ns.connect(nf).connect(ng).connect(master); ns.start(t + 0.14);
    },
    step() {
      if (!ctx || !on || ducked) return;
      const t = ctx.currentTime;
      const nb = ctx.createBuffer(1, ctx.sampleRate * 0.05, ctx.sampleRate);
      const nd = nb.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * (1 - i / nd.length);
      const ns = ctx.createBufferSource(); ns.buffer = nb;
      const g = ctx.createGain(); g.gain.value = 0.03;
      const f = ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 400;
      ns.connect(f).connect(g).connect(master); ns.start(t);
    },
  };
})();

/* ---------- input ---------- */

const keys = Object.create(null);

function startIfNeeded() {
  if (state.started) return true;
  state.started = true;
  els.title.classList.add("gone");
  sound.unlock();
  return false;   // swallow the key that dismissed the title card
}

function onKeyDown(e) {
  if (state.playing) {
    if (e.key === "Escape") { e.preventDefault(); leave(); }
    return;
  }
  if (!startIfNeeded()) { e.preventDefault(); return; }

  const k = e.key;
  if (k === "ArrowLeft"  || k === "a" || k === "A") { keys.left = true;  e.preventDefault(); }
  if (k === "ArrowRight" || k === "d" || k === "D") { keys.right = true; e.preventDefault(); }
  if (k === "Enter" || k === " ") {
    e.preventDefault();
    if (state.activeIdx >= 0) play(slots[state.activeIdx]);
  }
  if (k === "c" || k === "C") { e.preventDefault(); insertCoin(); }
  if (k === "m" || k === "M") { e.preventDefault(); sound.toggle(); }
}

function onKeyUp(e) {
  const k = e.key;
  if (k === "ArrowLeft"  || k === "a" || k === "A") keys.left = false;
  if (k === "ArrowRight" || k === "d" || k === "D") keys.right = false;
}

window.addEventListener("keydown", onKeyDown);
window.addEventListener("keyup", onKeyUp);

/* An attract cabinet can grab focus for a frame before the loop takes it back
   (Space Invaders and Lunar Lander both call canvas.focus()). If the player
   happens to RELEASE an arrow key during that frame, the keyup lands in the
   game's document and the shell never hears it — the key sticks down and the
   little guy walks to the end of the hall on his own. Listening in the frame
   too means a keyup can never be lost. Same-origin, so this is allowed. */
function bindKeysInto(frame) {
  try {
    const d = frame.contentDocument;
    if (!d) return;
    /* Capture phase on the frame's document, which runs before the game's own
       window/canvas listeners. Six of these games call ensureAudio() straight
       out of their keydown handler, so a single key landing in an attract
       cabinet boots that game's audio — night-driver starts a continuous engine
       oscillator — in a context our mixer has no handle on. Swallowing the
       event here stops that at the source; the shell still gets the keystroke
       because these ARE the shell's handlers. */
    const eat = (h) => (e) => { h(e); e.stopImmediatePropagation(); };
    d.addEventListener("keydown", eat(onKeyDown), true);
    d.addEventListener("keyup", eat(onKeyUp), true);
  } catch (_) { /* cross-origin: the loop's focus reclaim is the fallback */ }
}

/* Belt and braces on the above: an attract cabinet must be silent no matter
   what wakes its audio up — a timer, a click that slips through, a game we add
   later. Same-origin, so we can hand the frame an AudioContext whose
   destination is a dead-end gain node. The game builds its whole graph as
   usual and hears nothing, which keeps M authoritative over the entire room. */
function silenceFrame(frame) {
  try {
    const w = frame.contentWindow;
    const Real = w.AudioContext || w.webkitAudioContext;
    if (!Real || Real.__silenced) return;

    function Silent() {
      const c = new Real(...arguments);
      try {
        const sink = c.createGain();
        sink.gain.value = 0;                       // connected to nothing
        Object.defineProperty(c, "destination", { value: sink, configurable: true });
        c.resume = () => Promise.resolve();        // and it never wakes up
        c.suspend();
      } catch (_) { }
      return c;
    }
    Silent.prototype = Real.prototype;
    Silent.__silenced = true;
    w.AudioContext = Silent;
    w.webkitAudioContext = Silent;
  } catch (_) { }
}

/* If the window loses focus mid-stride the keyup never arrives and the player
   walks off down the hall forever. Drop every held key on blur. */
function releaseAll() { keys.left = false; keys.right = false; }

/* Distinguish "the player alt-tabbed away" from "an attract cabinet stole the
   keyboard". Only the first should drop the keys the player is holding. */
function attractHasFocus() {
  const ae = document.activeElement;
  return !!(ae && ae.tagName === "IFRAME" && ae.id !== "stageFrame");
}

window.addEventListener("blur", () => {
  /* Ask the document, not activeElement. hasFocus() is true when we OR any of
     our frames hold the keyboard, so it stays true through a cabinet stealing
     focus and through the tick loop taking it back — and it only goes false on
     a real alt-tab. Testing activeElement here instead raced the reclaim in the
     loop below: reclaim ran first, this check then saw plain body and released
     a key the player was still holding, stranding him mid-aisle. */
  setTimeout(() => { if (!document.hasFocus()) releaseAll(); }, 0);
});
document.addEventListener("visibilitychange", () => { if (document.hidden) releaseAll(); });

els.stageBack.addEventListener("click", leave);
document.getElementById("soundToggle").addEventListener("click", () => {
  startIfNeeded(); sound.toggle();
});
els.title.addEventListener("click", () => startIfNeeded());

/* touch */
if (window.matchMedia("(pointer: coarse)").matches) {
  document.body.classList.add("touch");
}
function holdBtn(id, key) {
  const b = document.getElementById(id);
  const down = (e) => { e.preventDefault(); startIfNeeded(); keys[key] = true; };
  const up   = (e) => { e.preventDefault(); keys[key] = false; };
  b.addEventListener("pointerdown", down);
  b.addEventListener("pointerup", up);
  b.addEventListener("pointercancel", up);
  b.addEventListener("pointerleave", up);
}
holdBtn("tLeft", "left");
holdBtn("tRight", "right");
document.getElementById("tPlay").addEventListener("click", (e) => {
  e.preventDefault();
  startIfNeeded();
  if (state.activeIdx >= 0) play(slots[state.activeIdx]);
});

/* swipe to pan the floor */
(() => {
  let downX = null, startPX = 0;
  els.viewport.addEventListener("pointerdown", (e) => {
    if (e.pointerType !== "touch" || state.playing) return;
    downX = e.clientX; startPX = state.playerX;
  });
  els.viewport.addEventListener("pointermove", (e) => {
    if (downX === null) return;
    const dx = (downX - e.clientX) / state.scale;
    state.playerX = clampX(startPX + dx);
  });
  const end = () => { downX = null; };
  els.viewport.addEventListener("pointerup", end);
  els.viewport.addEventListener("pointercancel", end);
})();

function clampX(x) {
  return Math.max(120, Math.min(state.hallWidth - 120, x));
}

/* ---------- loop ---------- */

let stepAccum = 0;
let roomAccum = 0;

function tick(t) {
  const dt = Math.min(48, t - (state.lastT || t));
  state.lastT = t;

  if (!state.playing) {
    // Backstop for focus theft by an attract cabinet (see attractHasFocus).
    // `inert` should prevent it, but a game calling focus() from inside its own
    // document can still win in some browsers, and losing the keyboard here
    // strands the player mid-aisle.
    if (attractHasFocus()) {
      document.activeElement.blur();
      window.focus();
    }

    let dir = 0;
    if (keys.left)  dir -= 1;
    if (keys.right) dir += 1;

    if (dir !== 0) {
      state.playerX = clampX(state.playerX + dir * WALK_SPEED * dt);
      state.facing = dir;
      els.player.classList.add("walking");
      els.player.classList.remove("gazing");
      stepAccum += dt;
      if (stepAccum > 230) { stepAccum = 0; sound.step(); }
    } else {
      els.player.classList.remove("walking");
      stepAccum = 0;
    }

    updateActive();

    // stood still in front of a machine -> turn around and watch it
    if (dir === 0) {
      els.player.classList.toggle("gazing", state.activeIdx >= 0);
    }

    /* Head tracking. Walking, he watches the machine he is coming up on and
       switches to the next one the moment he crosses its centre, which is what
       makes it read as looking rather than scanning. Standing, he is square on
       to the cabinet he's at, so the yaw settles back to zero. The lerp is what
       turns the switch into a turn of the head instead of a snap. */
    let look = null;
    if (dir !== 0) {
      for (const s of slots) {
        const cx = s.x + s.w / 2;
        const ahead = dir > 0 ? cx > state.playerX : cx < state.playerX;
        if (ahead && (look === null || Math.abs(cx - state.playerX) < Math.abs(look - state.playerX))) {
          look = cx;
        }
      }
    }
    if (look === null && state.activeIdx >= 0) {
      look = slots[state.activeIdx].x + slots[state.activeIdx].w / 2;
    }
    const wantYaw = look === null ? 0
      : Math.max(-1, Math.min(1, (look - state.playerX) / 240));
    // fast enough to reach square-on by the time he's level with a machine —
    // at 0.12 the ease lagged and he passed every cabinet still looking ahead
    state.headYaw += (wantYaw - state.headYaw) * 0.22;
    // the sprite is mirrored by scaleX when he walks left, so a yaw meant for
    // world-right has to be negated to still land world-right
    els.player.style.setProperty("--yaw",
      (state.headYaw * (state.facing || 1)).toFixed(3));

    // move the room mix with him: each distant machine pans and fades by
    // how far down the hall it is
    roomAccum += dt;
    if (roomAccum > 120) { roomAccum = 0; sound.roomAt(state.playerX); }
  }

  render(false);
  requestAnimationFrame(tick);
}

/* ---------- go ---------- */

buildHall();
resize();
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", () => setTimeout(resize, 120));
requestAnimationFrame(tick);
</script>
</body>
</html>
